# host: interface to listen on. Empty = all interfaces (admin.token required).
# Set 127.0.0.1 to keep the admin API local-only without a token.
host: ""
port: 8080
db_path: hookrelay.db

# Bearer token for /events, /dlq and /metrics. Prefer the HOOKRELAY_ADMIN_TOKEN
# env var over writing it here. Generate one with: openssl rand -hex 32
admin:
  token: ""

targets:
  - id: my-service
    url: https://my-service.example.com/webhooks
    secret: change-me-to-a-strong-secret
    max_attempts: 10
    timeout_ms: 5000

  - id: walletd-credits
    url: http://localhost:9090/events
    secret: walletd-webhook-secret
    max_attempts: 10
    timeout_ms: 3000
